packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - keccak
  - prisma
  - secp256k1
  - sharp

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  keccak: true
  prisma: true
  secp256k1: true
  sharp: true
